name: RepliGrant check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GenLayer test and lint tools
        run: python -m pip install genlayer-test genvm-linter
      - name: Cache verified GenVM runner
        run: genvm-lint download --version "$GENVM_VERSION"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Contract lint
        run: genvm-lint check contracts/repligrant.py
      - name: Direct contract tests
        run: python -m pytest tests/direct -q
      - name: Frontend typecheck, tests, build
        run: npm --prefix frontend run typecheck && npm --prefix frontend test && npm --prefix frontend run build
